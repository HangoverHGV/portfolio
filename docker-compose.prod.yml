version: "3.9"

services:
  app:
    image: hangoverhgv/portfolio-frontend:1.0
    container_name: Frontend
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    image: hangoverhgv/portfolio-backend:1.0
    container_name: Backend
    command: "uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: changeme
      POSTGRES_PORT: 5432
      SUPERUSER_SECRET_TOKEN: "supersecret"
      SECRET_KEY: "SecretKey"
    depends_on:
      - db

  db:
    image: postgres:latest
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: changeme

volumes:
    db-data:

